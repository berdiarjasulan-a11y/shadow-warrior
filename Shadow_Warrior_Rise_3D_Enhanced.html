 if(e.state!='strike')g.rotation.y=ang(g.rotation.y,Math.atan2(dx,dz),dt*8);
 const mvT=s=>{q.x+=dx/dist*s*dt;q.z+=dz/dist*s*dt};
 if(e.t=='ninja'&&P.atk>0&&dist<3.2&&e.dcd<=0&&rnd()<dt*5){e.dcd=1.6;e.inv=.3;e.dash=.25;e.sd=rnd()<.5?1:-1}
 if(e.dash>0){e.dash-=dt;q.x+=-dz/dist*e.sd*10*dt;q.z+=dx/dist*e.sd*10*dt}
 if(e.t=='samurai'&&P.atk>0&&dist<3.5&&!e.blk&&e.bcd<=0&&rnd()<dt*5){e.blk=true;e.bt=.9;e.bcd=1.6}
 if(e.state=='app'){if(dist>e.rng*.9)mvT(spd);else if(!e.blk){if(ph==3&&e.wcd<=0){e.state='wave';e.tm=1.1;e.wcd=6;ring(1,q.x,q.z,6,1.1)}else{e.state='wind';e.tm=e.wd/(1+(ph-1)*.25)}}}
 else if(e.state=='wind'){e.tm-=dt;if(e.tm<=0){e.sw=.3;if(ph>=2&&dist>2)e.lun=.25;
   if(dist<e.rng+.8)hurtP(e.dmg,q.x,q.z,e.t=='brutus'?9:4);e.cn++;if(e.t=='ninja'&&e.cn%2){e.tm=.18}else{e.state='rec';e.tm=e.rc}}}
 else if(e.state=='rec'){e.tm-=dt;if(dist<3.5&&e.t!='boss')mvT(-spd*.5);if(e.tm<=0)e.state='app'}
 else if(e.state=='wave'){e.tm-=dt;if(e.tm<=0){if(dist<6&&P.y<.8)hurtP(25,q.x,q.z,12);spark(q,0xef4444,10);beep(55,.4,'sawtooth');e.state='rec';e.tm=1}}
 if(e.lun>0){e.lun-=dt;mvT(14)}
 const l=Math.hypot(q.x,q.z);if(l>16.5){q.x*=16.5/l;q.z*=16.5/l}}
function spawn(t,k,n){const d=ED[t],m=1+.2*lv,a=(k-(n-1)/2)*.8,g=mk(d.col,d.sc,d.gl,d.w);g.position.set(Math.sin(a)*9,0,Math.cos(a)*9);g.rotation.y=PI;
 E.push({t,g,hp:d.hp*m,mhp:d.hp*m,sp:d.sp*(1+.04*lv),dmg:d.dmg*(1+.12*lv),rng:d.rng,wd:d.wd,rc:d.rc,rad:.5*d.sc,state:'app',tm:0,kx:0,kz:0,stun:0,inv:0,dcd:0,wcd:3,bt:0,bcd:0,sw:0,cn:0,blk:false,dead:false,ph:1})}
// ---- поток игры ----
function show(h,p,btns){const o=$('ov');o.innerHTML=`<h1>${h}</h1><p>${p||''}</p>`;o.style.display='flex';btns.forEach(([t,f])=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{beep(300,.05);f()};o.appendChild(b)})}
const SV='swr1';const save=()=>{try{localStorage.setItem(SV,JSON.stringify({lv,P:{mhp:P.mhp,mst:P.mst,dmg:P.dmg,lvl:P.lvl,xp:P.xp,coins:P.coins}}))}catch(e){}};
const load=()=>{try{return JSON.parse(localStorage.getItem(SV))}catch(e){return null}};
function start(i){lv=i;build(i);E.forEach(e=>S.remove(e.g));E=[];LV[i].forEach((t,k,a)=>spawn(t,k,a.length));resetP();$('ov').style.display='none';mode='play';$('lvn').textContent=NM[i];
 C.position.set(0,5,-14);Lk.set(0,1,0);cin=i==4?2.2:0;if(cin)beep(50,1.5,'sawtooth')}
function lose(){dead=true;P.g.rotation.x=-1.5;mode='end';show('ПОРАЖЕНИЕ','Кайро пал. Тени ещё сильнее.',[['Повторить уровень',()=>start(lv)],['В меню',menu]])}
function win(){mode='end';P.coins+=30+10*lv;const need=()=>P.lvl*80;let up='';while(P.xp>=need()){P.xp-=need();P.lvl++;P.mhp+=10;P.mst+=5;P.dmg+=.05;up=' Новый уровень героя!'}
 if(lv==4){save();show('ПОБЕДА','Тёмный Мастер повержен, Кайро отомстил за деревню. Тень рассеялась.'+up,[['Сыграть снова',()=>start(0)],['В меню',menu]]);return}
 lv++;save();upg(up)}
function upg(msg){const c=()=>P.coins;show('УЛУЧШЕНИЯ',`${msg||''} Монеты: ${c()} · Ур. ${P.lvl} · HP ${P.mhp} · урон x${P.dmg.toFixed(2)} · стамина ${P.mst}`,[
 ['+20 HP (30🪙)',()=>{if(c()>=30){P.coins-=30;P.mhp+=20;save()}upg()}],['+12% урона (40🪙)',()=>{if(c()>=40){P.coins-=40;P.dmg+=.12;save()}upg()}],['+20 стамины (30🪙)',()=>{if(c()>=30){P.coins-=30;P.mst+=20;save()}upg()}],['Дальше: '+NM[lv]+' ▶',()=>start(lv)]])}
let hq=true;function menu(){mode='menu';P.g.visible=false;E.forEach(e=>S.remove(e.g));E=[];build(0);const s=load();
 const b=[['Играть'+(s?` (уровень ${s.lv+1})`:''),()=>{if(s){Object.assign(P,s.P)}start(s?s.lv:0)}],['Новая игра',()=>{Object.assign(P,{mhp:100,mst:100,dmg:1,lvl:1,xp:0,coins:0});start(0)}],['Графика: '+(hq?'высокая':'низкая'),()=>{hq=!hq;moon.castShadow=hq;R.setPixelRatio(hq?Math.min(devicePixelRatio,2):1);menu()}]];
 show('SHADOW WARRIOR: RISE','Деревня Кайро сожжена Тёмным Мастером. Пройди 5 локаций: полигон, лес, храм, крепость, Замок теней. Управление: джойстик слева, кнопки справа. Void Strike (VOID) требует 50 энергии — она копится от ударов.',b)}
function camUpdate(dt){const p=P.g.position,t=nearest();let tx,ty,tz,lx=p.x,lz=p.z;
 if(cin>0&&E[0]){const q=E[0].g.position;tx=q.x*1.2;tz=q.z+7;ty=3.5;lx=q.x;lz=q.z}
 else if(t){const q=t.g.position;let dx=q.x-p.x,dz=q.z-p.z;const l=Math.hypot(dx,dz)||1;dx/=l;dz/=l;const back=Math.min(11,6+l*.5);tx=p.x-dx*back-dz*1.5;tz=p.z-dz*back+dx*1.5;ty=4.5+l*.15;lx=(p.x+q.x)/2;lz=(p.z+q.z)/2}
 else{tx=p.x-Math.sin(P.face)*7;tz=p.z-Math.cos(P.face)*7;ty=4.5}
 const l=Math.hypot(tx,tz);if(l>18){tx*=18/l;tz*=18/l}  // камера не уходит за стены
 const k=1-Math.exp(-4*dt);C.position.x+=(tx-C.position.x)*k;C.position.y+=(ty-C.position.y)*k;C.position.z+=(tz-C.position.z)*k;Lk.x+=(lx-Lk.x)*k*1.5;Lk.z+=(lz-Lk.z)*k*1.5;Lk.y=1.3;C.lookAt(Lk)}
function fxFight(g,dt,over,swing){const u=g.userData;u.ft=Math.max(0,u.ft-dt);u.bm.emissive.setHex(u.ft>0?0xffffff:over||0);u.arm.rotation.x=-swing}
let last=performance.now(),tt=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;tt+=dt;
 if(mode=='menu'){const a=tt*.2;C.position.set(Math.sin(a)*14,5,Math.cos(a)*14);C.lookAt(0,1.5,0)}
 else if(mode=='play'||mode=='end'){
  if(cin>0&&mode=='play'){cin-=dt;camUpdate(dt)}
  else{if(mode=='play'){playerUpdate(dt);E.forEach(e=>enemyUpdate(e,dt));if(!E.some(e=>!e.dead)&&!winT){winT=1.6}if(winT>0){winT-=dt;if(winT<=0&&!dead&&mode=='play')win();if(winT<=0)winT=0}}camUpdate(dt)}
  const pe=P.atkT=='V'&&P.atk>0?0x6d28d9:P.blk?0x113366:0,ps=P.atk>0?Math.sin((1-P.atk/P.atkD)*PI)*2.2:0;fxFight(P.g,dt,pe,ps);
  for(const e of E)if(!e.dead){const sw=e.sw>0?Math.sin((1-e.sw/.3)*PI)*2.2:e.state=='wind'?1.2:0;fxFight(e.g,dt,e.state=='wind'||e.state=='wave'?0x771111:e.blk?0x113366:0,sw)}
  $('hp').style.width=Math.max(0,P.hp/P.mhp*100)+'%';$('st').style.width=P.st/P.mst*100+'%';$('en').style.width=P.en+'%';$('lv').textContent=P.lvl;$('co').textContent=P.coins;
  $('cmb').textContent=P.hits>1?P.hits+' COMBO':'';const n=nearest();$('enn').textContent=n?ED[n.t].n:'';$('eh').style.width=n?Math.max(0,n.hp/n.mhp*100)+'%':'0%'}
 for(const q of PS)if(q.l>0){q.l-=dt;q.o.position.addScaledVector(q.v,dt);q.v.y-=12*dt;if(q.l<=0)q.o.visible=false}
 for(const r of RG)if(r.t>0){r.t-=dt;r.m.scale.setScalar(.2+r.mx*(1-Math.max(0,r.t)/r.d));if(r.t<=0)r.m.visible=false}
 torches.forEach((l,i)=>l.intensity=1.1+Math.sin(tt*9+i*2)*.25+rnd()*.15);
 R.render(S,C)}
build(0);resetP();menu();requestAnimationFrame(loop);
</script>
<script>
(() => {
  let coins = Number(localStorage.getItem('swr_coins') || 0);
  let upgrades = JSON.parse(localStorage.getItem('swr_upgrades') || '{"damage":0,"health":0,"energy":0}');
  let comboCount = 0, comboTimer = null;

  window.toggleUpgrade = function(){
    const p=document.getElementById('upgradePanel');
    p.style.display=p.style.display==='none'?'block':'none';
    document.getElementById('coinsValue').textContent=coins;
  };

  window.buyUpgrade = function(type){
    if(coins < 50){ showMsg('Not enough coins'); return; }
    coins -= 50; upgrades[type]++; 
    localStorage.setItem('swr_coins',coins);
    localStorage.setItem('swr_upgrades',JSON.stringify(upgrades));
    document.getElementById('coinsValue').textContent=coins;
    showMsg(type.toUpperCase()+' UPGRADED!');
  };

  window.restartGame = function(){
    location.reload();
  };

  window.addCoins = function(n){
    coins += n; localStorage.setItem('swr_coins',coins);
    const el=document.getElementById('coinsValue'); if(el) el.textContent=coins;
  };

  window.registerCombo = function(){
    comboCount++;
    clearTimeout(comboTimer);
    const el=document.getElementById('combo');
    el.textContent = comboCount + ' HIT COMBO!';
    el.style.opacity=1;
    comboTimer=setTimeout(()=>{comboCount=0;el.style.opacity=0},1200);
  };

  window.showMsg = function(t){
    const el=document.getElementById('levelMsg');
    el.textContent=t; el.style.opacity=1;
    setTimeout(()=>el.style.opacity=0,1100);
  };

  // Give existing attack functions a chance to trigger the combo UI.
  const oldAlert = window.alert;
  window.alert = function(msg){ showMsg(String(msg)); };

  // Expose state for easy integration with the existing game code.
  window.SWR = {get coins(){return coins}, get upgrades(){return upgrades}};
})();
</script>
